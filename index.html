<section class="hero"><div><p class="eyebrow">和温陣国の算数 ／ 小学1〜6年</p><h1>数を、<em>動かして</em>みよう。</h1><p class="intro">横と縦で場所を表すところから、回転、掛け算、割り算へ。<br>説明を読んで、方眼で試して、自分の手で解いてみよう。</p></div><div class="overall"><p>練習の達成状況</p><strong id="total">0 / 30</strong><progress id="progress" max="30" value="0" aria-label="正解した問題数"></progress><p id="saveStatus">学習状況はこのブラウザに保存されます。</p></div></section>

<noscript><p>操作と答え合わせにはJavaScriptが必要です。<a href="https://github.com/EC2045/torekimath/blob/main/index.md">教科書の文章版</a>も読めます。</p></noscript>
<footer><span>東暦数学 学習室 · 教科書案 v1 に基づく入門教材</span><button class="btn" id="reset">学習状況をリセット</button><span>数は10進数。回転は原点を中心に、反時計回りを正とします。</span></footer>

'use strict';
const chapters=[
{name:'数と位置',short:'方眼からはじめる',lead:'「いくつあるか」と「どこにあるか」。まずは数と場所を結びつけよう。',mode:'position',point:[3,2],topics:[
['10のまとまりをつくる','47は、10が4つと1が7つ。十の位が4、一の位が7です。8+5なら、5を2と3に分けて、まず10をつくります。','8+5 = 8+2+3 = 10+3 = 13'],
['場所は「よこ、たて」の順','(3,2) は、原点から右へ3、上へ2の場所。先に横へ、次に縦へ進んでみよう。縦から先に進んでも、着く場所は同じです。','(よこ, たて) = (3, 2)'],
['ひき算と並べ方','15−8は、10−8の2に残りの5を足して7。並べ方は書き出して調べます。「あ・い」の2人なら「あい」「いあ」の2通りです。','15−8 = (10−8)+5 = 7']
],quiz:[['8+5 は？',[13],'5を2と3に分けると、8+2+3=13。'],['13−6 は？',[7],'13から3を引いて10、さらに3を引いて7。'],['62の十の位は？',[6],'62は10が6つと1が2つ。十の位は6です。'],['右へ4、上へ1の場所は？',[4,1],'横が先、縦が後なので (4,1)。'],['2人「あ」「い」の並び方は何通り？',[2],'「あい」「いあ」の2通りです。']]},
{name:'負の数と2方向の計算',short:'反対向きも数にする',lead:'左と下には、マイナスの数を使う。横と縦をそれぞれ計算しよう。',mode:'add',point:[2,3],topics:[
['0をこえて、反対側へ','右へ3進んで左へ5戻ると、原点より左へ2。左と下を負の向きにすると、場所をひと続きに表せます。','3−5 = −2'],
['2次元数の足し算・引き算','ここから横と縦の組を「2次元数」と呼びます。足し引きでは、横同士・縦同士を計算します。','(a,b)+(c,d) = (a+c, b+d)\n(1,2)−(3,5) = (−2,−3)'],
['掛け算・等分とデータ','九九は同じ数を何回も足す計算。割り算は等しく分ける計算です。調べた数は表や棒グラフにすると比べやすくなります。','7×8 = 56\n12÷3 = 4（12こを3人で分ける）']
],quiz:[['(1,5)+(3,2) は？',[4,7],'横は1+3=4、縦は5+2=7。'],['(6,4)−(2,7) は？',[4,-3],'横は6−2=4、縦は4−7=−3。'],['3−7 は？',[-4],'右へ3、左へ7。原点より左へ4なので−4。'],['24÷6 は？',[4],'6人に4こずつ分けると24こ。'],['6×9 は？',[54],'6を9回足すと54。']]},
{name:'分解と回転の体験',short:'分ける・回す',lead:'難しい計算は、分けて考える。方眼では、点を90°ずつ回してみよう。',mode:'rotate',point:[3,2],topics:[
['分配法則と計算の順序','掛け算・割り算は足し引きより先。かっこがあれば、その中が先です。分配法則は、まとまりを分けて掛ける方法です。','3×(2+6) = 3×2+3×6 = 24\n12×13 = (10+2)×13 = 130+26 = 156'],
['文字と2次元数の分解','xはまだ分からない数の代わりです。x+5=12なら、両方から5を引いてx=7。2次元数も横だけと縦だけに分けられます。','(3,2) = (3,0)+(0,2)'],
['90°回転を体験する','反時計回りに90°回すと、右の向きは上、上の向きは左へ変わります。横と縦を入れ替え、新しい横の符号を反対にします。4回回すと元通り。','(x,y) → (−y,x)\n(3,2) → (−2,3)'],
['単位と組み合わせ','1Lは10dLなので、5dLは0.5L。シャツ2枚とズボン3本なら、それぞれのシャツに3通りずつあり、全部で6通りです。','5÷10 = 0.5\n2×3 = 6通り']
],quiz:[['13×13 は？',[169],'(10+3)×13=130+39=169。'],['x+5=12 の x は？',[7],'両方から5を引くと、x=12−5=7。'],['3×(2+6) は？',[24],'先にかっこの中を計算して3×8=24。'],['(4,3) を反時計回りに90°回すと？',[-3,4],'(x,y)→(−y,x) なので (−3,4)。'],['5dL は何L？',[0.5],'1L=10dL。5÷10=0.5L。']]},
{name:'展開と2次元数の掛け算',short:'回転を掛け算に',lead:'(0,1)を掛けると90°回る。この約束と分配法則から、掛け算の式をつくる。',mode:'multiply',point:[2,3],topics:[
['負の数・展開・因数分解','負の数を掛けるのは、向きを反対にする操作です。展開は分配法則でかっこを開くこと。因数分解は、その逆です。','(−2)×(−3) = 6\n(x+2)(x+3) = x²+5x+6'],
['回転を掛け算にする','(0,1)を掛けると90°回る、と約束します。2回なら180°回るので、(0,1)×(0,1)=(−1,0)です。普通の数kは(k,0)として扱い、横・縦をk倍します。','(0,1)×(0,1) = (−1,0)'],
['分解して、4つの積を足す','(a,b)と(c,d)を横だけ・縦だけに分けます。横同士は(ac,0)、横と縦は(0,ad)と(0,bc)、縦同士は(−bd,0)。合わせると公式になります。','(a,b)×(c,d) = (ac−bd, ad+bc)\n(2,3)×(4,1) = (8−3, 2+12) = (5,14)'],
['分数・比例・平方','分数は分母をそろえて足します。比例y=kxは、xが2倍ならyも2倍になる関係。平方は同じ数を2回掛けることです。','1/2+1/3 = 3/6+2/6 = 5/6\ny=3x：x=2ならy=6\n17² = (10+7)² = 100+140+49 = 289']
],quiz:[['(−4)×(−5) は？',[20],'向きを2回反対にすると元の向き。4×5=20。'],['1/4+1/2 は？',[0.75],'1/2=2/4なので、1/4+2/4=3/4。3/4でも入力できます。'],['(3,1)×(2,5) は？',[1,17],'横は3×2−1×5=1、縦は3×5+1×2=17。'],['(0,1)×(0,1) は？',[-1,0],'90°回転を2回すると180°。右向きが左向きになります。'],['17² は？',[289],'(10+7)²=100+140+49=289。']]},
{name:'回転・図形・長さ',short:'大きさと距離を調べる',lead:'掛け算で点を回したり、拡大したり。長さの2乗にも、横と縦が現れる。',mode:'scale',point:[3,4],topics:[
['回転と拡大縮小','(0,1)は90°、(−1,0)は180°、(0,−1)は270°回転です。(k,0)を掛けると横も縦もk倍。正のkなら向きは変わりません。','(3,4)×(0,1) = (−4,3)\n(3,4)×(2,0) = (6,8)'],
['図形の面積','三角形は同じものを2つ合わせると平行四辺形に。台形は同じものを回して合わせると、底辺が上底+下底の平行四辺形になります。円周率はここでは3.14で計算します。','三角形：底辺×高さ÷2\n台形：(上底+下底)×高さ÷2\n円：半径×半径×3.14'],
['距離の2乗を面積で考える','(3,4)までの斜めの長さを一辺にした正方形を考えます。7×7の正方形から、底辺3・高さ4の直角三角形4つを除くと、面積は49−24=25。だから斜めの長さの2乗は25です。','距離の2乗 = x²+y²\n3²+4² = 9+16 = 25'],
['累乗・反比例・平均','(0,1)の累乗は4回で(1,0)に戻ります。反比例xy=kは積が一定。平均は、合計を個数で割って求めます。','(0,1)⁴ = (1,0)\nxy=12：x=3ならy=4\n3,5,7の平均 = (3+5+7)÷3 = 5']
],quiz:[['(5,2)×(0,1) は？',[-2,5],'90°回転なので、(x,y)→(−y,x)。'],['(2,−3) を反時計回りに270°回すと？',[-3,-2],'270°回転は (x,y)→(y,−x)。'],['原点から(6,8)までの距離の2乗は？',[100],'6²+8²=36+64=100。距離そのものは10です。'],['上底4・下底6・高さ5の台形の面積は？',[25],'(4+6)×5÷2=25。'],['23² は？',[529],'(20+3)²=400+120+9=529。']]},
{name:'割り算と平方根',short:'掛け算を元に戻す',lead:'まず「裏返し」から。途中式を一つずつ見て、自分のペースで進めよう。',mode:'divide',point:[5,1],topics:[
['裏返しと襷（たすき）','(c,d)の裏返しは(c,−d)。横軸に対して反対側に移します。2つを掛けると縦が0になり、横にc²+d²が残ります。この1つの数を襷と呼びます。','(c,d)×(c,−d) = (c²+d²,0)\n(3,4)×(3,−4) = (25,0)'],
['2次元数で割る','割る数の裏返しを掛け、横と縦をそれぞれ襷で割ります。割る数が(0,0)だと襷も0になるため、割れません。答えに割る数を掛けて検算します。','T = c²+d²\n(a,b)÷(c,d) = ((ac+bd)/T, (bc−ad)/T)\n(5,1)÷(0,1) = (1,−5)'],
['平方根と距離','√aは、2乗するとaになる0以上の数です（a≥0）。距離の2乗は襷と同じなので、距離は√襷。(1,1)の距離√2は1.41と1.42の間です。','距離 = √(x²+y²)\n(5,12)：√(25+144) = √169 = 13\n√0 = 0'],
['分数の乗除・体積・確率','分数で割るときは、割る数の分子と分母を入れ替えて掛けます。柱の体積は底面積×高さ。公平なコインを2回投げて表が1回だけ出るのは、表裏・裏表の2通りです。','3/4÷3/8 = 3/4×8/3 = 2\n直方体：たて×よこ×高さ\n表が1回だけの確率 = 2/4 = 1/2']
],quiz:[['(7,1)÷(1,2) は？',[1.8,-2.6],'襷は1²+2²=5。横は(7+2)/5=9/5、縦は(1−14)/5=−13/5。'],['(1,0)÷(1,1) は？',[0.5,-0.5],'襷は2。横は1/2、縦は−1/2。'],['√289 は？',[17],'17×17=289なので√289=17。'],['原点から(8,15)までの距離は？',[17],'距離は√(8²+15²)=√289=17。'],['たて3・よこ4・高さ5の直方体の体積は？',[60],'3×4×5=60。']]}
];
const gradeSixSteps = [

function renderGuidedTopics(topics, topicSteps) {
  let topic = 0;
  let step = 0;
  const panel = $('#guided-step');
  const previous = $('#guided-back');
  const next = $('#guided-next');
  const select = $('#guided-topic');
  select.innerHTML = topics.map(([title], i) => `<option value="${i}">${i + 1}. ${title}</option>`).join('');
  function show() {
    const steps = topicSteps[topic];
    const [title, explanation, formula] = steps[step];
    select.value = topic;
    panel.innerHTML = `<p class="chapter">手順 ${step + 1} / ${steps.length}</p>
      <h3>${title}</h3><p>${explanation}</p><pre class="formula">${formula}</pre>`;
    previous.disabled = topic === 0 && step === 0;
    next.disabled = topic === topicSteps.length - 1 && step === steps.length - 1;
    next.textContent = step === steps.length - 1 && !next.disabled ? '次のテーマへ →' : '次の手順 →';
    const formulaSummary = $('#guided-summary');
    formulaSummary.open = false;
    formulaSummary.querySelector('p').textContent = topics[topic][1];
    formulaSummary.querySelector('pre').textContent = topics[topic][2];
  }
  function move(direction) {
    step += direction;
    if (step < 0) {
      topic--;
      step = topicSteps[topic].length - 1;
    } else if (step === topicSteps[topic].length) {
      topic++;
      step = 0;
    }
    show();
    if (document.activeElement.disabled) panel.focus();
  }
  select.onchange = () => {
    topic = Number(select.value);
    step = 0;
    show();
  };
  previous.onclick = () => move(-1);
  next.onclick = () => move(1);
  show();
}

const calculationSheets = new Map();

function mountCalculationSheet(chapter, question) {
  const sheetKey = chapter + '-' + question;
  if (!calculationSheets.has(sheetKey)) calculationSheets.set(sheetKey, []);
  const strokes = calculationSheets.get(sheetKey);
  const paper = $('#calculation-paper');
  const undo = $('#calculation-undo');
  const clear = $('#calculation-clear');
  let activePointer = null;
  let activePath;

  function addPath(data) {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', data);
    paper.append(path);
    return path;
  }
  function redraw() {
    paper.replaceChildren();
    strokes.forEach(addPath);
    undo.disabled = clear.disabled = strokes.length === 0 || activePointer !== null;
  }
  function point(event) {
    const box = paper.getBoundingClientRect();
    return [(event.clientX - box.left) * 600 / box.width,
      (event.clientY - box.top) * 260 / box.height].map(value => value.toFixed(1)).join(' ');
  }
  paper.onpointerdown = event => {
    if (activePointer !== null || event.button !== 0) return;
    event.preventDefault();
    paper.setPointerCapture(event.pointerId);
    activePointer = event.pointerId;
    const start = point(event);
    activePath = addPath(`M ${start} L ${start}`);
    undo.disabled = clear.disabled = true;
  };
  paper.onpointermove = event => {
    if (event.pointerId !== activePointer) return;
    activePath.setAttribute('d', activePath.getAttribute('d') + ' L ' + point(event));
  };
  function finish(event) {
    if (event.pointerId !== activePointer) return;
    strokes.push(activePath.getAttribute('d'));
    activePointer = null;
    undo.disabled = clear.disabled = false;
  }
  paper.onpointerup = paper.onpointercancel = paper.onlostpointercapture = finish;
  undo.onclick = () => { strokes.pop(); redraw(); };
  clear.onclick = () => {
    if (!confirm('この問題の計算メモを消しますか？')) return;
    strokes.length = 0;
    redraw();
  };
  redraw();
}
